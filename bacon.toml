default_job = "all-template-validation"

[jobs.all-template-validation]
command = [
    "bash",
    "-lc",
    "./scripts/validate-templates.sh Init && ./scripts/validate-templates.sh Modules/api-db-handler generated-template && ./scripts/validate-templates.sh Modules/api-fetcher generated-template && ./scripts/validate-templates.sh Modules/background-worker generated-template && ./scripts/validate-templates.sh Modules/api-gateway generated-template && ./scripts/validate-templates.sh Modules/db-handler generated-template && ./scripts/validate-templates.sh Modules/rest-api generated-template",
]
need_stdout = true
background = false
on_change_strategy = "kill_then_restart"
watch = ["Init", "Modules", "bacon.toml", "scripts/validate-templates.sh"]

[jobs.validate-init]
command = ["./scripts/validate-templates.sh", "Init"]
need_stdout = true
background = false
on_change_strategy = "kill_then_restart"
watch = ["Init", "bacon.toml", "scripts/validate-templates.sh"]

[jobs.validate-api-db-handler]
command = [
    "./scripts/validate-templates.sh",
    "Modules/api-db-handler",
]
need_stdout = true
background = false
on_change_strategy = "kill_then_restart"
watch = [
    "Modules/api-db-handler",
    "bacon.toml",
    "scripts/validate-templates.sh",
]

[jobs.validate-background-worker]
command = [
    "./scripts/validate-templates.sh",
